spring.application.name=fairdrop
server.port=${PORT:8080}

# --- PostgreSQL (source of truth) -------------------------------------------------------------
spring.datasource.url=${FAIRDROP_DB_URL:jdbc:postgresql://localhost:5432/fairdrop}
spring.datasource.username=${FAIRDROP_DB_USERNAME:postgres}
spring.datasource.password=${FAIRDROP_DB_PASSWORD}
spring.datasource.hikari.pool-name=fairdrop-db
spring.datasource.hikari.maximum-pool-size=${FAIRDROP_DB_POOL_SIZE:10}
# Fail fast under pool exhaustion (mapped to HTTP 503) instead of queueing requests for 30s.
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${FAIRDROP_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Redis / Memurai (rate limiting + drop cache) ---------------------------------------------
spring.data.redis.host=${FAIRDROP_REDIS_HOST:localhost}
spring.data.redis.port=${FAIRDROP_REDIS_PORT:6379}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=1s

fairdrop.rate-limit.join.max-requests=5
fairdrop.rate-limit.join.window=1m

fairdrop.cache.drop.enabled=true
fairdrop.cache.drop.ttl=30s
fairdrop.cache.drop.circuit-breaker.failure-rate-threshold=50
fairdrop.cache.drop.circuit-breaker.sliding-window-size=20
fairdrop.cache.drop.circuit-breaker.minimum-number-of-calls=10
fairdrop.cache.drop.circuit-breaker.wait-duration-in-open-state=30s

# --- Kafka (asynchronous domain events) -------------------------------------------------------
spring.kafka.bootstrap-servers=${FAIRDROP_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.auto-create=${FAIRDROP_KAFKA_AUTO_CREATE_TOPICS:true}
spring.kafka.admin.operation-timeout=10s

spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=15000

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

fairdrop.kafka.allocation-events-topic=fairdrop.allocation-events
fairdrop.kafka.dead-letter-suffix=.dlt
fairdrop.kafka.allocation-audit-group-id=fairdrop-allocation-audit
fairdrop.kafka.topic-partitions=3
fairdrop.kafka.topic-replicas=1
fairdrop.kafka.consumer-retry.max-retries=4
fairdrop.kafka.consumer-retry.initial-interval=1s
fairdrop.kafka.consumer-retry.multiplier=2.0
fairdrop.kafka.consumer-retry.max-interval=10s

# --- Transactional outbox relay ---------------------------------------------------------------
fairdrop.outbox.publisher.enabled=${FAIRDROP_OUTBOX_PUBLISHER_ENABLED:true}
fairdrop.outbox.publisher.poll-interval=1s
fairdrop.outbox.publisher.batch-size=100
fairdrop.outbox.publisher.send-timeout=30s
fairdrop.outbox.publisher.max-attempts=20
fairdrop.outbox.publisher.initial-backoff=1s
fairdrop.outbox.publisher.max-backoff=5m
fairdrop.outbox.retention=7d
fairdrop.outbox.cleanup-cron=0 30 3 * * *
fairdrop.outbox.backlog-refresh-interval=15s

spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=fairdrop-scheduler-

# --- Observability ----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.fairdrop=true

logging.pattern.level=%5p [%X{correlationId:-}]

# --- Lifecycle --------------------------------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- API documentation ------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs

management.info.env.enabled=true
info.app.name=FairDrop
info.app.description=High-concurrency fair allocation API
info.app.version=1.0.0
