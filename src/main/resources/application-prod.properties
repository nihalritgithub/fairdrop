# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
# Redis URL overrides the host/port settings in application.properties.
spring.data.redis.url=${FAIRDROP_REDIS_URL}

# Managed Kafka / Redpanda credentials.
spring.kafka.security.protocol=${FAIRDROP_KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${FAIRDROP_KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
spring.kafka.properties.sasl.jaas.config=${FAIRDROP_KAFKA_SASL_JAAS_CONFIG}

# Managed Kafka services commonly require topics to be created explicitly.
spring.kafka.admin.auto-create=${FAIRDROP_KAFKA_AUTO_CREATE_TOPICS:false}
