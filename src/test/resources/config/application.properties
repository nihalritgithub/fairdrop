# Test overrides, layered on top of src/main/resources/application.properties.
# No Kafka broker is assumed: the outbox is still written, but relaying, consuming and topic
# creation are switched off. Tests that run an embedded broker re-enable them explicitly.
fairdrop.outbox.publisher.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
